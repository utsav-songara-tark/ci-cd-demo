name: Parallel and Sequential Jobs

on:
  workflow_dispatch:

jobs:

  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Display date
        run: date

  job2:
    runs-on: ubuntu-latest
    steps:
      - name: Print current directory
        run: pwd

  job3:
    runs-on: ubuntu-latest
    steps:
      - name: List all files
        run: ls -la

  job4:
    runs-on: ubuntu-latest
    steps:
      - name: Show environment variables
        run: env

  job5:
    runs-on: ubuntu-latest
    steps:
      - name: Display disk usage
        run: df -h

  job6:
    runs-on: ubuntu-latest
    steps:
      - name: Display memory information
        run: free -h

  wait-for-all:
    runs-on: ubuntu-latest
    needs:
      - job1
      - job2
      - job3
      - job4
      - job5
      - job6
    steps:
      - name: All parallel jobs completed
        run: |
          echo "================================"
          echo "All six jobs completed!"
          echo "================================"

  sequential-job-1:
    runs-on: ubuntu-latest
    needs: wait-for-all
    steps:
      - name: Check Git version
        run: git --version

  sequential-job-2:
    runs-on: ubuntu-latest
    needs: sequential-job-1
    steps:
      - name: Check Python version
        run: python3 --version

  sequential-job-3:
    runs-on: ubuntu-latest
    needs: sequential-job-2
    steps:
      - name: Check Node version
        run: node --version

  sequential-job-4:
    runs-on: ubuntu-latest
    needs: sequential-job-3
    steps:
      - name: Check Java version
        run: java -version
