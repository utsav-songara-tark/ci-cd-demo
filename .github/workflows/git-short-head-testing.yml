
name: Git Short SHA Experiment

on:
  workflow_dispatch:

jobs:
  full-clone:
    name: Full clone - fetch-depth 0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Git repository
        shell: bash
        run: |
          echo "=== Full Clone ==="
          echo "Full SHA:"
          git rev-parse HEAD

          echo ""
          echo "Short SHA:"
          git rev-parse --short HEAD

          echo ""
          echo "Short SHA (7):"
          git rev-parse --short=7 HEAD

          echo ""
          echo "Commit count:"
          git rev-list --all --count

          echo ""
          echo "Object count:"
          git count-objects -v

  shallow-clone:
    name: Shallow clone - fetch-depth 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect Git repository
        shell: bash
        run: |
          echo "=== Shallow Clone ==="
          echo "Full SHA:"
          git rev-parse HEAD

          echo ""
          echo "Short SHA:"
          git rev-parse --short HEAD

          echo ""
          echo "Short SHA (7):"
          git rev-parse --short=7 HEAD

          echo ""
          echo "Commit count:"
          git rev-list --all --count

          echo ""
          echo "Object count:"
          git count-objects -v
