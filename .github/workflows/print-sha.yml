name: Print sha from run id

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the build to deploy'
        required: true

jobs:
  print_sha_from_run_id:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Get commit SHA from build run
        id: extract
        shell: powershell
        run: |
          $run_id = "${{ github.event.inputs.run_id }}"
          $repo = "${{ github.repository }}"
          $headers = @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" }
          $url = "https://api.github.com/repos/$repo/actions/runs/$run_id"
          $response = Invoke-RestMethod -Uri $url -Headers $headers
          echo "commit_sha=$($response.head_sha)" >> $env:GITHUB_OUTPUT
