name: Build Rule Engine Projects

on:
  push:
     branches: 
       - main
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Provide branch name or commit SHA or tag id of build'
        required: true

jobs:
  build:
    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags
          ref: ${{ github.event.inputs.checkout_ref }}  # Checkout the specific branch, commit SHA, or tag

      - name: Create Hello World File with commit SHA
        run: |
          commit_sha=$(git rev-parse HEAD)
          echo "Hello World from commit $commit_sha" > hello.txt
          echo "Current commit SHA: $commit_sha"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-artifact
          path: ${{ github.workspace }}/hello.txt