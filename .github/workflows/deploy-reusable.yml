# .github/workflows/deploy-reusable.yml
name: Reusable Deployment Workflow

on:
  workflow_call:
    inputs:
        environment:
            required: true
            type: string
    secrets:
        ZIP_PASSWORD:
            required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
        ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reusable Deployment Step
        run: |
            echo "Hello, this is a reusable workflow for deployment."
            echo ${{ env.ZIP_PASSWORD }}
            echo ${{ secrets.ZIP_PASSWORD }}
