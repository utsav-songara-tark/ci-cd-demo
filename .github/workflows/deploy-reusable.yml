name: Deploy Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Print Environment
        run: echo "Deploying to ${{ inputs.environment }}"

      - name: Use Secret
        run: echo "Using secret token ${{ secrets.ZIP_PASSWORD }}"
